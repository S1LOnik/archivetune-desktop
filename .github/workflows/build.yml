name: Build & Package Desktop Client

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux (AppImage & tar.gz)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Rust WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

      - name: Verify build
        run: |
          npm run typecheck
          npm run test:audio-dsp
          npm run test:source-routing
          npm run test:races
          node scripts/test-native-queue.cjs
          node scripts/test-palette-offline.cjs

      - name: Package AppImage and tar.gz
        run: npx electron-builder --linux AppImage tar.gz --x64 --publish never

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ArchiveTune-Linux
          path: |
            release/*.AppImage
            release/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  build-windows:
    name: Build Windows (NSIS Installer & Portable .exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Rust WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

      - name: Package Windows Installer & Portable
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ArchiveTune-Windows
          path: |
            release/*.exe
          if-no-files-found: error
          retention-days: 30
